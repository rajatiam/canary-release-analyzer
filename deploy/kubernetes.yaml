apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: canary-release-analyzer-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-release-analyzer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: canary-release-analyzer
  template:
    metadata:
      labels:
        app: canary-release-analyzer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: app
          image: canary-release-analyzer:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8118
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8118
          livenessProbe:
            httpGet:
              path: /health
              port: 8118
            initialDelaySeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: canary-release-analyzer-data
---
apiVersion: v1
kind: Service
metadata:
  name: canary-release-analyzer
spec:
  selector:
    app: canary-release-analyzer
  ports:
    - port: 80
      targetPort: 8118
